name: Refresh data
on:
  schedule: [{cron: '15 11 * * *'}, {cron: '15 17 * * *'}, {cron: '15 23 * * *'}]   # 6:15 AM, 12:15 PM, 6:15 PM CT during early voting
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - id: window
        # scheduled runs stop after Nov 4, 2026 (manual runs always allowed)
        run: if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y%m%d)" -le 20261104 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.window.outputs.go == '1'
        uses: actions/checkout@v4
      - if: steps.window.outputs.go == '1'
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - if: steps.window.outputs.go == '1'
        run: pip install pandas lxml beautifulsoup4 html5lib
      - if: steps.window.outputs.go == '1'
        run: python pipeline/build_data.py
      - if: steps.window.outputs.go == '1'
        run: |
          git config user.name "midterm-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/data.json; git diff --cached --quiet || (git commit -m "Daily data refresh" && git pull --rebase && git push)
